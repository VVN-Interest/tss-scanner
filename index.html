<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 TSS Code 128 動態掃描器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #121212; color: #fff; text-align: center; font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; }
    #reader-preview {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      border: 3px solid #0d6efd;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }
    /* 💡 關鍵修復 1：防止影像被裁切，確保條碼左右「純白留白區 (Quiet Zone)」完整可見 */
    #reader-preview video {
      object-fit: contain !important;
      width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body class="p-3">

  <h4 class="mt-2 text-primary fw-bold">📷 Code 128 長條碼專用掃描器</h4>
  <p class="text-warning small mb-1">💡 <b>iPad 掃描秘訣</b>：請保持 <b>25 ~ 35 公分</b> 距離，確保條碼兩端白邊完整呈現</p>

  <!-- 狀態提示列 -->
  <div id="status-msg" class="alert alert-info py-2 small">⌛ 正在啟動鏡頭中...</div>

  <!-- 相機即時預覽區 -->
  <div id="reader-preview"></div>

  <!-- 操作按鈕區 -->
  <div class="d-flex justify-content-center gap-2 mt-2">
    <button id="btn-switch" class="btn btn-warning fw-bold px-3" onclick="switchCamera()">🔄 切換鏡頭</button>
    <button class="btn btn-outline-light fw-bold px-3" onclick="window.close()">✕ 關閉視窗</button>
  </div>

  <script>
    var html5QrCode = null;
    var currentCameraIndex = 0;
    var cameraDevices = [];

    window.onload = function() {
      initScanner();
    };

    function initScanner() {
      var config = {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13
        ],
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // 優先啟用 iOS / Android 系統內建晶片硬體條碼加速
        }
      };

      html5QrCode = new Html5Qrcode("reader-preview", config);

      Html5Qrcode.getCameras().then(function(devices) {
        if (devices && devices.length > 0) {
          cameraDevices = devices;
          currentCameraIndex = devices.length - 1;

          for (var i = 0; i < devices.length; i++) {
            var label = devices[i].label.toLowerCase();
            if (label.includes('back') || label.includes('rear') || label.includes('environment') || label.includes('主相機')) {
              currentCameraIndex = i;
              break;
            }
          }

          startScanWithDeviceId(cameraDevices[currentCameraIndex].id);
        } else {
          startScanWithFacingMode();
        }
      }).catch(function(err) {
        startScanWithFacingMode();
      });
    }

    // 💡 關鍵修復 2：調整取樣張數 (FPS: 10)，讓 CPU 有充足時間精準演算長條碼
    function getScanConfig() {
      return {
        fps: 10,
        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };
    }

    function startScanWithDeviceId(deviceId) {
      var statusEl = document.getElementById('status-msg');
      var scanConfig = getScanConfig();

      html5QrCode.start(deviceId, scanConfig, onScanSuccess)
        .then(function() {
          statusEl.className = "alert alert-success py-2 small";
          statusEl.innerText = "🟢 高清鏡頭已就緒！請將 iPad 拿遠一點 (25~35cm) 對焦條碼";
        })
        .catch(function(err) {
          startScanWithFacingMode();
        });
    }

    function startScanWithFacingMode() {
      var statusEl = document.getElementById('status-msg');
      var scanConfig = getScanConfig();

      html5QrCode.start({ facingMode: "environment" }, scanConfig, onScanSuccess)
        .then(function() {
          statusEl.className = "alert alert-success py-2 small";
          statusEl.innerText = "🟢 後置鏡頭已開啟！請保持 25~35cm 距離對焦";
        })
        .catch(function(err) {
          statusEl.className = "alert alert-danger py-2 small";
          statusEl.innerText = "❌ 無法開啟鏡頭：" + err;
        });
    }

    function switchCamera() {
      if (!cameraDevices || cameraDevices.length <= 1) {
        alert("⚠️ 系統目前僅偵測到 1 個可用的鏡頭！");
        return;
      }

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() {
          currentCameraIndex = (currentCameraIndex + 1) % cameraDevices.length;
          startScanWithDeviceId(cameraDevices[currentCameraIndex].id);
        }).catch(function(err) {
          console.error("切換鏡頭失敗：", err);
        });
      }
    }

    function onScanSuccess(decodedText) {
      if (window.opener) {
        window.opener.postMessage({ type: 'BARCODE_SCANNED', barcode: decodedText }, '*');
      }

      if (html5QrCode) {
        html5QrCode.stop().then(function() { window.close(); }).catch(function() { window.close(); });
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
