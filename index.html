<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 TSS Code 128 凍結多重演算掃描器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #121212; color: #fff; text-align: center; font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; }
    
    #preview-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      border: 3px solid #0d6efd;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      min-height: 250px;
    }
    
    #reader-preview video {
      width: 100% !important;
      height: auto !important;
      transform-origin: center center;
      transition: transform 0.2s ease-in-out;
      image-rendering: -webkit-optimize-contrast;
    }

    /* 🎯 藍色黃金對焦框 (70px 高度) */
    .scan-target-box {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 70px;
      margin-top: -35px;
      border: 2.5px dashed #0dcaf0;
      pointer-events: none;
      z-index: 10;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(13, 202, 240, 0.8);
    }

    .scan-target-box::after {
      content: "🎯 請將條碼完整放進藍虛線框內";
      position: absolute;
      top: -22px;
      left: 0;
      width: 100%;
      font-size: 12px;
      color: #0dcaf0;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body class="p-3">

  <h4 class="mt-2 text-primary fw-bold">📷 Code 128 凍結多重演算掃描器</h4>
  <p class="text-warning small mb-2">💡 <b>LG 機身 SN 秘訣</b>：切換 <b>2.5x / 3.0x</b> 後對準藍虛線，點擊爆破解碼！</p>

  <!-- 狀態提示列 -->
  <div id="status-msg" class="alert alert-info py-2 small">⌛ 正在啟動高清相機...</div>

  <!-- 相機預覽區與藍虛線目標框 -->
  <div id="preview-wrapper">
    <div class="scan-target-box"></div>
    <div id="reader-preview"></div>
  </div>

  <!-- 🔍 倍率切換按鈕區 -->
  <div class="mb-3">
    <span class="small me-2">🔍 畫面放大倍率：</span>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-outline-info btn-sm active" onclick="setZoom(1.0, this)">1.0x</button>
      <button type="button" class="btn btn-outline-info btn-sm" onclick="setZoom(1.5, this)">1.5x</button>
      <button type="button" class="btn btn-outline-info btn-sm" onclick="setZoom(2.5, this)">2.5x</button>
      <button type="button" class="btn btn-outline-warning btn-sm fw-bold" onclick="setZoom(3.0, this)">3.0x</button>
    </div>
  </div>

  <!-- 隱藏的原生相機 input (備用) -->
  <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display: none;" onchange="handleFileScan(this)">

  <!-- 操作按鈕區 -->
  <div class="d-grid gap-2 col-11 col-md-8 mx-auto mt-2">
    <button class="btn btn-primary btn-lg fw-bold shadow" onclick="freezeAndMultiScan()">⚡ 凍結畫面 + 多重演算法爆破解碼</button>

    <div class="d-flex justify-content-center gap-2 mt-1">
      <button class="btn btn-outline-success btn-sm fw-bold" onclick="triggerPhotoScan()">📸 原生拍照備用</button>
      <button id="btn-switch" class="btn btn-warning btn-sm fw-bold" onclick="switchCamera()">🔄 切換鏡頭</button>
      <button class="btn btn-outline-light btn-sm fw-bold" onclick="window.close()">✕ 關閉</button>
    </div>
  </div>

  <script>
    var html5QrCode = null;
    var currentCameraIndex = 0;
    var cameraDevices = [];
    var currentZoomLevel = 1.0;

    window.onload = function() {
      initScanner();
    };

    function initScanner() {
      try {
        var config = {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39
          ],
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        };

        html5QrCode = new Html5Qrcode("reader-preview", config);

        Html5Qrcode.getCameras().then(function(devices) {
          if (devices && devices.length > 0) {
            cameraDevices = devices;
            currentCameraIndex = devices.length - 1;

            for (var i = 0; i < devices.length; i++) {
              var label = devices[i].label.toLowerCase();
              if (label.includes('back') || label.includes('rear') || label.includes('environment') || label.includes('主相機')) {
                currentCameraIndex = i;
                break;
              }
            }

            startScanWithDeviceId(cameraDevices[currentCameraIndex].id);
          } else {
            startScanWithFacingMode();
          }
        }).catch(function(err) {
          startScanWithFacingMode();
        });
      } catch (e) {
        showCameraError("初始化失敗：" + e.message);
      }
    }

    function getScanConfig() {
      return {
        fps: 15,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          var boxWidth = Math.min(Math.floor(viewfinderWidth * 0.85), 400);
          return { width: Math.max(boxWidth, 250), height: 100 };
        },
        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };
    }

    function startScanWithDeviceId(deviceId) {
      var statusEl = document.getElementById('status-msg');
      html5QrCode.start(deviceId, getScanConfig(), onScanSuccess)
        .then(function() {
          statusEl.className = "alert alert-success py-2 small";
          statusEl.innerText = "🟢 高清相機已就緒！請將條碼對準藍虛線，點擊「⚡ 凍結畫面 + 多重演算法」";
          applyCssZoom(currentZoomLevel);
        })
        .catch(function(err) { startScanWithFacingMode(); });
    }

    function startScanWithFacingMode() {
      var statusEl = document.getElementById('status-msg');
      html5QrCode.start({ facingMode: "environment" }, getScanConfig(), onScanSuccess)
        .then(function() {
          statusEl.className = "alert alert-success py-2 small";
          statusEl.innerText = "🟢 高清鏡頭已開啟！請將條碼對準藍虛線，點擊「⚡ 凍結畫面 + 多重演算法」";
          applyCssZoom(currentZoomLevel);
        })
        .catch(function(err) { showCameraError(err); });
    }

    function showCameraError(err) {
      var statusEl = document.getElementById('status-msg');
      statusEl.className = "alert alert-danger py-2 small";
      statusEl.innerText = "❌ 相機開啟失敗：請確認 Safari 相機權限！";
    }

    function setZoom(zoomValue, btn) {
      currentZoomLevel = zoomValue;
      var btns = document.querySelectorAll('.btn-group .btn');
      btns.forEach(function(b) { b.classList.remove('active'); });
      if (btn) btn.classList.add('active');

      applyCssZoom(zoomValue);
    }

    function applyCssZoom(zoomValue) {
      var videoEl = document.querySelector('#reader-preview video');
      if (videoEl) {
        videoEl.style.transform = 'scale(' + zoomValue + ')';
      }
    }

    // 💡 核心爆破演算法：擷取畫面並同步生成 3 種變體進行流水線解碼
    function freezeAndMultiScan() {
      var videoEl = document.querySelector('#reader-preview video');
      var statusEl = document.getElementById('status-msg');

      if (!videoEl || videoEl.readyState !== 4 || !videoEl.videoWidth) {
        alert("⚠️ 鏡頭尚未準備就緒，請稍等 1 秒後再試！");
        return;
      }

      statusEl.className = "alert alert-warning py-2 small";
      statusEl.innerText = "⚡ 畫面已凍結，正在進行「三重演算法爆破解碼」中...";

      var vw = videoEl.videoWidth;
      var vh = videoEl.videoHeight;

      var cropWidth = (vw * 0.85) / currentZoomLevel;
      var cropHeight = (vh * 0.25) / currentZoomLevel;
      var cropX = (vw - cropWidth) / 2;
      var cropY = (vh - cropHeight) / 2;

      // 1. 生成 3 張不同濾鏡處理的 Canvas
      var canvasA = createCanvasVariant(videoEl, cropX, cropY, cropWidth, cropHeight, 'none');
      var canvasB = createCanvasVariant(videoEl, cropX, cropY, cropWidth, cropHeight, 'grayscale(100%) contrast(180%)');
      var canvasC = createCanvasVariant(videoEl, cropX, cropY, cropWidth, cropHeight, 'threshold');

      var variants = [
        { canvas: canvasA, name: '原圖高清' },
        { canvas: canvasB, name: '灰階高對比' },
        { canvas: canvasC, name: '二值化極淨' }
      ];

      // 2. 啟動流水線解碼
      processDecodePipeline(variants, 0);
    }

    // 建立 Canvas 變體輔助函式
    function createCanvasVariant(videoEl, cx, cy, cw, ch, filterType) {
      var canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 350;
      var ctx = canvas.getContext('2d');

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      if (filterType === 'threshold') {
        // 先繪製原圖
        ctx.drawImage(videoEl, cx, cy, cw, ch, 0, 0, 1200, 350);
        // 套用自適應二值化 (Adaptive Thresholding) 處理
        applyThresholdingFilter(ctx, 1200, 350);
      } else {
        if (filterType !== 'none') {
          ctx.filter = filterType;
        }
        ctx.drawImage(videoEl, cx, cy, cw, ch, 0, 0, 1200, 350);
      }

      return canvas;
    }

    // 將圖像轉換為黑白極淨二值化陣列
    function applyThresholdingFilter(ctx, w, h) {
      var imgData = ctx.getImageData(0, 0, w, h);
      var d = imgData.data;
      for (var i = 0; i < d.length; i += 4) {
        var avg = (d[i] + d[i + 1] + d[i + 2]) / 3;
        var threshold = avg > 128 ? 255 : 0;
        d[i] = threshold;
        d[i + 1] = threshold;
        d[i + 2] = threshold;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // 順序執行流水線解碼
    function processDecodePipeline(variants, index) {
      if (index >= variants.length) {
        var statusEl = document.getElementById('status-msg');
        statusEl.className = "alert alert-danger py-2 small";
        statusEl.innerText = "❌ 三重演算法解析未通過：請調整 2.5x/3.0x 確保條碼完整在藍虛線內！";
        return;
      }

      var currentVariant = variants[index];
      
      // A. 優先嘗試 Apple 硬體晶片條碼辨識器
      if ('BarcodeDetector' in window) {
        var barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'code_39'] });
        barcodeDetector.detect(currentVariant.canvas)
          .then(function(barcodes) {
            if (barcodes && barcodes.length > 0) {
              onScanSuccess(barcodes[0].rawValue);
            } else {
              tryScanWithFileEngine(currentVariant.canvas, function(success, text) {
                if (success) {
                  onScanSuccess(text);
                } else {
                  processDecodePipeline(variants, index + 1);
                }
              });
            }
          })
          .catch(function() {
            processDecodePipeline(variants, index + 1);
          });
      } else {
        tryScanWithFileEngine(currentVariant.canvas, function(success, text) {
          if (success) {
            onScanSuccess(text);
          } else {
            processDecodePipeline(variants, index + 1);
          }
        });
      }
    }

    function tryScanWithFileEngine(canvas, callback) {
      canvas.toBlob(function(blob) {
        var file = new File([blob], "pipeline_frame.jpg", { type: "image/jpeg" });
        html5QrCode.scanFile(file, false)
          .then(function(decodedText) {
            callback(true, decodedText);
          })
          .catch(function() {
            callback(false, null);
          });
      }, 'image/jpeg', 0.95);
    }

    function switchCamera() {
      if (!cameraDevices || cameraDevices.length <= 1) {
        alert("⚠️ 系統目前僅偵測到 1 個可用的鏡頭！");
        return;
      }

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() {
          currentCameraIndex = (currentCameraIndex + 1) % cameraDevices.length;
          startScanWithDeviceId(cameraDevices[currentCameraIndex].id);
        });
      }
    }

    function triggerPhotoScan() {
      document.getElementById('qr-input-file').click();
    }

    function handleFileScan(input) {
      if (!input.files || input.files.length === 0) return;
      var file = input.files[0];
      html5QrCode.scanFile(file, false)
        .then(function(decodedText) { onScanSuccess(decodedText); })
        .catch(function() { alert("⚠️ 照片辨識失敗，請重試！"); });
    }

    function onScanSuccess(decodedText) {
      if (window.opener) {
        window.opener.postMessage({ type: 'BARCODE_SCANNED', barcode: decodedText }, '*');
      }

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() { window.close(); }).catch(function() { window.close(); });
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
