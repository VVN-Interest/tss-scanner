<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 TSS Code 128 精準線條掃描器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #121212; color: #fff; text-align: center; font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; }
    
    #preview-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      border: 3px solid #0d6efd;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      min-height: 250px;
    }
    
    #reader-preview video {
      width: 100% !important;
      height: auto !important;
    }

    .scan-target-line {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 40px;
      margin-top: -20px;
      border: 2px solid #ff3b30;
      background-color: rgba(255, 59, 48, 0.15);
      box-shadow: 0 0 12px rgba(255, 59, 48, 0.8);
      pointer-events: none;
      z-index: 10;
      border-radius: 6px;
    }

    .scan-target-line::after {
      content: "🎯 將條碼對準此紅線區域";
      position: absolute;
      top: -22px;
      left: 0;
      width: 100%;
      font-size: 12px;
      color: #ff3b30;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body class="p-3">

  <h4 class="mt-2 text-primary fw-bold">📷 Code 128 長條線精準辨識</h4>
  <p class="text-warning small mb-2">💡 拍照時請將<b>條碼放正中央，涵蓋在紅線框內</b>即可！</p>

  <!-- 狀態提示列 -->
  <div id="status-msg" class="alert alert-info py-2 small">⌛ 正在準備開啟相機...</div>

  <!-- 相機預覽區與紅線圖層 -->
  <div id="preview-wrapper">
    <div class="scan-target-line"></div>
    <div id="reader-preview"></div>
  </div>

  <!-- 隱藏的原生相機 input -->
  <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display: none;" onchange="handleFileScan(this)">

  <!-- 操作按鈕區 -->
  <div class="d-grid gap-2 col-11 col-md-8 mx-auto mt-2">
    <button class="btn btn-danger btn-lg fw-bold shadow" onclick="triggerPhotoScan()">📸 拍照紅線裁切辨識 (強效去除雜訊)</button>
    
    <div class="d-flex justify-content-center gap-2 mt-1">
      <button id="btn-switch" class="btn btn-warning fw-bold px-3" onclick="switchCamera()">🔄 切換鏡頭</button>
      <button class="btn btn-outline-light fw-bold px-3" onclick="window.close()">✕ 關閉視窗</button>
    </div>
  </div>

  <script>
    var html5QrCode = null;
    var currentCameraIndex = 0;
    var cameraDevices = [];

    window.onload = function() {
      initScanner();
    };

    function initScanner() {
      try {
        var config = {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39
          ],
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        };

        html5QrCode = new Html5Qrcode("reader-preview", config);

        Html5Qrcode.getCameras().then(function(devices) {
          if (devices && devices.length > 0) {
            cameraDevices = devices;
            currentCameraIndex = devices.length - 1;

            for (var i = 0; i < devices.length; i++) {
              var label = devices[i].label.toLowerCase();
              if (label.includes('back') || label.includes('rear') || label.includes('environment') || label.includes('主相機')) {
                currentCameraIndex = i;
                break;
              }
            }

            startScanWithDeviceId(cameraDevices[currentCameraIndex].id);
          } else {
            startScanWithFacingMode();
          }
        }).catch(function(err) {
          console.warn("無法取得裝置列表，改用內建對向模式啟動：", err);
          startScanWithFacingMode();
        });
      } catch (e) {
        showCameraError("套件初始化失敗：" + e.message);
      }
    }

    function getScanConfig() {
      return {
        fps: 15,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          var boxWidth = Math.min(Math.floor(viewfinderWidth * 0.9), 420);
          return { width: Math.max(boxWidth, 260), height: 100 };
        },
        videoConstraints: { facingMode: "environment" }
      };
    }

    function startScanWithDeviceId(deviceId) {
      var statusEl = document.getElementById('status-msg');
      html5QrCode.start(deviceId, getScanConfig(), onScanSuccess)
        .then(function() {
          statusEl.className = "alert alert-success py-2 small";
          statusEl.innerText = "🟢 請將條碼對準紅線！微型貼紙請點下方「📸 拍照紅線裁切辨識」";
        })
        .catch(function(err) {
          startScanWithFacingMode();
        });
    }

    function startScanWithFacingMode() {
      var statusEl = document.getElementById('status-msg');
      html5QrCode.start({ facingMode: "environment" }, getScanConfig(), onScanSuccess)
        .then(function() {
          statusEl.className = "alert alert-success py-2 small";
          statusEl.innerText = "🟢 請將條碼對準紅線！微型貼紙請點下方「📸 拍照紅線裁切辨識」";
        })
        .catch(function(err) {
          showCameraError(err);
        });
    }

    function showCameraError(err) {
      var statusEl = document.getElementById('status-msg');
      statusEl.className = "alert alert-danger py-2 small";
      statusEl.innerText = "❌ 相機啟用失敗！請確認 Safari 權限：設定 ➔ Safari ➔ 相機 ➔ 允許";
      alert("⚠️ 無法開啟相機鏡頭！\n\n【檢查步驟】：\n1. 請確認 iPad 的 Safari 是否已允許「相機」存取權限。\n2. 若您依然需要辨識，可以直接點擊綠色/紅色「📸 拍照辨識」按鈕！\n\n錯誤資訊：" + err);
    }

    function switchCamera() {
      if (!cameraDevices || cameraDevices.length <= 1) {
        alert("⚠️ 系統目前僅偵測到 1 個可用的鏡頭！");
        return;
      }

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() {
          currentCameraIndex = (currentCameraIndex + 1) % cameraDevices.length;
          startScanWithDeviceId(cameraDevices[currentCameraIndex].id);
        }).catch(function(err) {
          console.error("切換鏡頭失敗：", err);
        });
      }
    }

    function triggerPhotoScan() {
      document.getElementById('qr-input-file').click();
    }

    function handleFileScan(input) {
      if (!input.files || input.files.length === 0) return;

      var statusEl = document.getElementById('status-msg');
      statusEl.className = "alert alert-warning py-2 small";
      statusEl.innerText = "✂️ 正在進行紅線區域精準裁切與辨識...";

      var file = input.files[0];

      cropToHorizontalLineROI(file, function(croppedBlob) {
        var croppedFile = new File([croppedBlob], "roi_strip.jpg", { type: "image/jpeg" });

        html5QrCode.scanFile(croppedFile, false)
          .then(function(decodedText) {
            onScanSuccess(decodedText);
          })
          .catch(function(err) {
            html5QrCode.scanFile(file, false)
              .then(function(fullDecodedText) {
                onScanSuccess(fullDecodedText);
              })
              .catch(function(fullErr) {
                statusEl.className = "alert alert-danger py-2 small";
                statusEl.innerText = "❌ 辨識失敗：請確保照片對焦清晰，且條碼完整涵蓋在中央紅線內！";
                alert("⚠️ 請將條碼放在照片正中央對準紅線位置重新拍攝！");
              });
          });
      });
    }

    function cropToHorizontalLineROI(file, callback) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');

          var cropWidth = Math.round(img.width * 0.90);
          var cropHeight = Math.round(img.height * 0.22);
          var cropX = Math.round((img.width - cropWidth) / 2);
          var cropY = Math.round((img.height - cropHeight) / 2);

          var outputWidth = cropWidth;
          var outputHeight = cropHeight;
          if (outputWidth > 1400) {
            outputHeight = Math.round(outputHeight * (1400 / outputWidth));
            outputWidth = 1400;
          }

          canvas.width = outputWidth;
          canvas.height = outputHeight;

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          ctx.drawImage(img, cropX, cropY, cropWidth, cropHeight, 0, 0, outputWidth, outputHeight);

          canvas.toBlob(function(blob) {
            callback(blob);
          }, 'image/jpeg', 0.92);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function onScanSuccess(decodedText) {
      if (window.opener) {
        window.opener.postMessage({ type: 'BARCODE_SCANNED', barcode: decodedText }, '*');
      }

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() { window.close(); }).catch(function() { window.close(); });
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
