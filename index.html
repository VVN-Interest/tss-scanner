<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 TSS Code 128 動態掃描器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #121212; color: #fff; text-align: center; font-family: "Microsoft JhengHei", sans-serif; }
    #reader-preview { width: 100%; max-width: 480px; min-height: 260px; margin: 15px auto; border: 3px solid #0d6efd; border-radius: 12px; overflow: hidden; background-color: #000; }
  </style>
</head>
<body class="p-3">

  <h4 class="mt-2 text-primary fw-bold">📷 Code 128 條碼動態掃描器</h4>
  <p class="text-light small">請將設備條碼橫向對準藍色框框中央</p>

  <!-- 狀態提示列 -->
  <div id="status-msg" class="alert alert-info py-2 small">⌛ 正在開啟相機鏡頭...</div>

  <!-- 相機即時預覽區 -->
  <div id="reader-preview"></div>

  <button class="btn btn-outline-light mt-2 px-4 fw-bold" onclick="window.close()">✕ 關閉視窗</button>

  <script>
    var html5QrCode = null;

    window.onload = function() {
      startCamera();
    };

    function startCamera() {
      var statusEl = document.getElementById('status-msg');

      var config = {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13
        ]
      };

      html5QrCode = new Html5Qrcode("reader-preview", config);

      var scanConfig = {
        fps: 15,
        qrbox: { width: 280, height: 120 } // 長方形框最適配 Code 128
      };

      // 自動選擇相機 (優先後置主鏡頭，若為電腦則選預設 Webcam)
      Html5Qrcode.getCameras().then(function(devices) {
        var selectedCameraId = (devices && devices.length > 0) ? devices[0].id : null;

        if (devices && devices.length > 0) {
          for (var i = 0; i < devices.length; i++) {
            var label = devices[i].label.toLowerCase();
            if (label.includes('back') || label.includes('rear') || label.includes('environment')) {
              selectedCameraId = devices[i].id;
              break;
            }
          }
        }

        var cameraConstraint = selectedCameraId ? selectedCameraId : { facingMode: "environment" };

        html5QrCode.start(cameraConstraint, scanConfig, onScanSuccess)
          .then(function() {
            statusEl.className = "alert alert-success py-2 small";
            statusEl.innerText = "🟢 相機已成功開啟！請將 Code 128 條碼對準中央";
          })
          .catch(function(err) {
            statusEl.className = "alert alert-danger py-2 small";
            statusEl.innerText = "⚠️ 相機啟動失敗：" + err;
          });

      }).catch(function(err) {
        // 退回機制
        html5QrCode.start({ facingMode: "environment" }, scanConfig, onScanSuccess)
          .then(function() {
            statusEl.className = "alert alert-success py-2 small";
            statusEl.innerText = "🟢 相機已成功開啟！請將 Code 128 條碼對準中央";
          })
          .catch(function(e) {
            statusEl.className = "alert alert-danger py-2 small";
            statusEl.innerText = "❌ 無法開啟鏡頭：" + e;
          });
      });
    }

    function onScanSuccess(decodedText) {
      // 💡 跨網域安全傳輸條碼數字給母視窗 (Admin.html)
      if (window.opener) {
        window.opener.postMessage({ type: 'BARCODE_SCANNED', barcode: decodedText }, '*');
      }

      // 自動關閉鏡頭與視窗
      if (html5QrCode) {
        html5QrCode.stop().then(function() { window.close(); }).catch(function() { window.close(); });
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
